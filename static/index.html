<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek 知识库助手</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --border:#e2e5ea; --accent:#4f6ef7; --text:#1f2329; --muted:#6b7280; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
    header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--border); font-weight:600; }
    #chat { max-width:760px; margin:0 auto; padding:20px 16px 90px; }
    .msg { margin:12px 0; display:flex; }
    .msg.user { justify-content:flex-end; }
    .bubble { max-width:78%; padding:10px 14px; border-radius:12px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
    .user .bubble { background:var(--accent); color:#fff; }
    .assistant .bubble { background:var(--card); border:1px solid var(--border); }
    .sources { margin-top:8px; font-size:12px; color:var(--muted); }
    .sources div { margin:2px 0; }
    .sources b { color:var(--accent); }
    footer { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--border); padding:12px 16px; }
    form { max-width:760px; margin:0 auto; display:flex; gap:8px; }
    input { flex:1; padding:11px 14px; border:1px solid var(--border); border-radius:8px; font-size:15px; outline:none; }
    input:focus { border-color:var(--accent); }
    button { padding:0 20px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
  </style>
</head>
<body>
  <header>DeepSeek 知识库助手</header>
  <div id="chat"></div>
  <footer>
    <form id="form">
      <input id="input" placeholder="向知识库提问…" autocomplete="off" autofocus>
      <button id="send" type="submit">发送</button>
    </form>
  </footer>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    let history = [];

    function addMessage(role, text, sources) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      wrap.appendChild(bubble);

      if (sources && sources.length) {
        const box = document.createElement('div');
        box.className = 'sources';
        box.innerHTML = '<div>📚 参考来源：</div>' + sources.map(s =>
          `<div><b>[${s.index}]</b> ${s.source} (相似度 ${s.score})</div>`
        ).join('');
        const col = document.createElement('div');
        col.appendChild(bubble);
        col.appendChild(box);
        wrap.appendChild(col);
        wrap.removeChild(bubble);
      }
      chat.appendChild(wrap);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message || send.disabled) return;
      addMessage('user', message);
      input.value = '';
      send.disabled = true;
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '请求失败');
        addMessage('assistant', data.reply, data.sources);
        history.push({ role: 'user', content: message });
        history.push({ role: 'assistant', content: data.reply });
      } catch (err) {
        addMessage('assistant', '⚠️ 出错了：' + err.message);
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
